[project]
name = "ai-operations-agent-backend"
version = "0.1.0"
description = "AI Operations Agent Platform - backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
markers = [
    "integration: requires a live PostgreSQL and Redis (skipped when unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
