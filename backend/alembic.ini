# Alembic configuration.
#
# The database URL is deliberately absent: alembic/env.py reads it from the
# application settings, so migrations and the application can never drift onto
# different databases, and no credential is stored in a tracked file.
#
#   alembic revision --autogenerate -m "add tenants"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic upgrade head --sql        # emit SQL without touching a database

[alembic]
script_location = alembic
prepend_sys_path = .

# Migration filenames are prefixed with UTC date and time, so they sort in the
# order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Format and lint every generated migration, so autogenerated files match the
# rest of the codebase.
hooks = ruff_format,ruff_check

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
