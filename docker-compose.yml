# =============================================================================
# AI Operations Agent Platform - local development stack
#
# This file is development. For a deployed environment see
# docker-compose.prod.yml and docs/deployment.md - the two share the same
# Dockerfiles and differ by build target, so nothing here has to be undone
# there.
#
#   docker compose up --build      start everything
#   docker compose ps              show status and health
#   docker compose logs -f backend tail a service
#   docker compose down            stop (data is kept)
#   docker compose down -v         stop and delete all data
#
# Every value below has a default, so the stack runs on a fresh checkout with
# no setup. Copy .env.example to .env to override any of them - Compose reads
# .env from this directory automatically.
# =============================================================================

name: ai-operations-agent

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - pgvector image so the RAG phase needs no database swap
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first creation of the volume only.
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops} -d ${POSTGRES_DB:-aiops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aiops

  # ---------------------------------------------------------------------------
  # Redis - cache, rate limiting and the future job queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aiops

  # ---------------------------------------------------------------------------
  # Backend - FastAPI on Python 3.12, auto-reloading on source changes
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
      # Named explicitly: the Dockerfile's last stage is `production`, so a
      # build without a target would quietly hand this stack the wrong image.
      target: development
    image: aiops-backend:dev
    container_name: aiops-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-AI Operations Agent Platform}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aiops:aiops_dev_password@postgres:5432/aiops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Redis is part of this stack, so treat its absence as a fault.
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      # Development default; staging/production refuse to start on it.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-jwt-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Only the selected provider needs a key; absent, the API still
      # starts and model calls fail with a clear configuration error.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_MAX_DELAY_SECONDS: ${LLM_RETRY_MAX_DELAY_SECONDS:-8}
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:-}
      # Observability, off by default here as it is everywhere. Passed through
      # so a developer can turn either on without editing this file - metrics
      # need a token whatever the environment, and tracing writes one log line
      # per request.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1.0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Mask the host virtualenv; the container uses its own system packages.
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiops

  # ---------------------------------------------------------------------------
  # Frontend - Next.js dev server with hot reload
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend/Dockerfile
      target: development
    image: aiops-frontend:dev
    container_name: aiops-frontend
    restart: unless-stopped
    environment:
      # Read by the browser, so this is the host-visible backend address.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AI Operations Agent Platform}
      # Bind-mounted source on Windows and macOS needs polling to trigger reloads.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Keep the Linux-built dependencies and build cache inside the container.
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - aiops

volumes:
  postgres_data:
  redis_data:

networks:
  aiops:
    driver: bridge
