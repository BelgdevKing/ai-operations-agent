  #   env_file: .env
  #   ports:
  #     - "${BACKEND_PORT:-8000}:8000"
  #   volumes:
  #     - ./backend:/app          # hot reload in development
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - aiops

  # ---------------------------------------------------------------------------
  # PLACEHOLDER - enable once frontend/ contains a Next.js application
  # ---------------------------------------------------------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: ../infrastructure/docker/frontend/Dockerfile
  #   container_name: aiops-frontend
  #   restart: unless-stopped
  #   environment:
  #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
